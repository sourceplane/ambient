apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: ratings-worker
  description: Cloudflare Worker for the ratings bounded context — user ratings, aggregates, charts and popularity meters
spec:
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture }
      - { path: docs/runbook.md, role: runbook }
  type: cloudflare-worker-turbo
  lifecycle: production
  owner: platform
  domain: catalog
  path: apps/ratings-worker
  # BF6 wiring documents from orun secrets (SEC-JOB): lease-published by
  # the infra components; wire-live renders the wrangler template from
  # these instead of Secrets Manager documents.
  secretEnv:
    WIRING_CLOUDFLARE_HYPERDRIVE_STAGE: "secret://ambient/ambient/stage/WIRING_CLOUDFLARE_HYPERDRIVE"
    WIRING_CLOUDFLARE_HYPERDRIVE_PROD: "secret://ambient/ambient/prod/WIRING_CLOUDFLARE_HYPERDRIVE"

  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"
    workspaceDir: ../..
    appDir: .
    orgName: sourceplane
    owner: sourceplane
    repo: ambient

    turboFilter: "@saas/ratings-worker"
    wranglerConfig: wrangler.jsonc
    wranglerTemplate: wrangler.template.jsonc
    wiringComponents: "cloudflare-hyperdrive"
    wiringEnvs: "stage,prod"
    wiringFixture: wiring.fixture.json
    installCommand: pnpm install --frozen-lockfile
    buildCommand: pnpm exec turbo run build --filter=@saas/ratings-worker
    typecheckCommand: pnpm exec turbo run typecheck --filter=@saas/ratings-worker
    dryRunCommand: pnpm exec wrangler deploy --dry-run --config wrangler.jsonc --env prod
    deployCommand: pnpm exec wrangler deploy --config wrangler.jsonc --env prod
    preDeployCommand: "echo 'No pre-deploy step configured.'"
    migrationCommand: "echo 'Migrations are owned by the db-migrate component.'"
    smokeCommand: "echo 'No smoke test configured.'"
  labels:
    team: platform
    layer: runtime
    surface: ratings
    runtime: cloudflare
